[tool.poetry]
name = "test-e2e"
version = "0.1.0"
description = "Playwright E2E tests for interview canvas collaboration"
authors = ["Saba Yahyaa"]
packages = [{include = "tests"}]

[tool.poetry.dependencies]
python = "^3.10"
pytest = "^8.0.0"
pytest-playwright = "^0.5.0"
playwright = "^1.40.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]