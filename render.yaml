############################################################
#   Cloud Multi-Container Environment Blueprint
############################################################
services:
  - type: web
    name: interviewer-canvas-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interviewer-postgres
          property: connectionString
      - key: SDIP_DATABASE_URL
        fromDatabase:
          name: interviewer-postgres
          property: connectionString
      - key: SDIP_JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8000"
      - key: INTERVIEWER_USER_ID
        sync: false
      - key: INTERVIEWER_EMAIL
        sync: false
      - key: INTERVIEWER_DISPLAY_NAME
        sync: false

databases:
  - name: interviewer-postgres
    databaseName: interviewer_db
    user: interviewer_user
    plan: free