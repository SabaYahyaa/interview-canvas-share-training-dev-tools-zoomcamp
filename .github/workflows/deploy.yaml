name: CI/CD Pipeline - Dev Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-deploy-dev:
    name: Run Tests, Build Image & Deploy Dev
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.CI_POSTGRES_USER }} -d ${{ secrets.CI_POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry & Dependencies
        run: |
          pip install poetry
          cd backend && poetry install --no-root

      - name: Quality Check (Black & Flake8)
        run: |
          cd backend
          poetry run black --check .
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}
        run: |
          cd backend
          poetry run pytest -v

      # --------------------------------------------------
      # Quality Gate 4: E2E Integration Suite (Playwright)
      # --------------------------------------------------
      - name: Start Docker Stack & Run E2E Tests
        env:
          SDIP_JWT_SECRET: ${{ secrets.SDIP_JWT_SECRET }}
        run: |
          # 0. Clean up Docker compose, stop host postgres, and free port 5432
          docker compose down -v --remove-orphans || true
          sudo systemctl stop postgresql || true
          docker ps -q --filter "ancestor=postgres:15-alpine" | xargs -r docker stop || true
          docker ps -q --filter "publish=5432" | xargs -r docker stop || true

          # 1. Spin up PostgreSQL and FastAPI Backend via Docker Compose
          docker compose up -d --build

          # 2. Wait for FastAPI app to be ready by checking /docs
          echo "Waiting for backend server at localhost:8000/docs..."
          timeout 30s bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs | grep -q "200"; do sleep 1; done' || (docker compose down -v; exit 1)

          # 3. Run containerized Playwright E2E tests against host network
          cd test-e2e
          docker run --rm --network host \
            -v "$(pwd):/work" \
            -w /work \
            mcr.microsoft.com/playwright/python:v1.63.0-jammy \
            sh -c "pip install poetry && poetry config virtualenvs.create false && poetry install --no-root && poetry run pytest" \
            || (STATUS=$?; cd .. && docker compose down -v; exit $STATUS)

          # 4. Clean up Docker stack after tests finish
          cd ..
          docker compose down -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata and Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix={{date 'YYYY-MM-DD'}}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Render Dev Deployment
        env:
          RENDER_DEV_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEV_DEPLOY_HOOK" ]; then
            echo "All tests passed. Triggering Dev deployment on Render..."
            curl -X POST "$RENDER_DEV_DEPLOY_HOOK"
          else
            echo "RENDER_DEV_DEPLOY_HOOK secret is not set."
            exit 1
          fi