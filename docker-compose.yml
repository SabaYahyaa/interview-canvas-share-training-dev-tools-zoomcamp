###########################################################
#   Local Multi-Container Environment
###########################################################
# To Run the application, use the following command:
# docker compose down -v --remove-orphans
# docker-compose up --build -d
# then: docker compose ps
# docker compose logs web
# run the test:  docker compose exec web pytest -v

networks:
  app-network:
    name: ${SDIP_NETWORK_NAME:-interviewer-net}
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: interviewer-postgres
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interviewer_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-interviewer_db}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    container_name: interviewer-canvas-container
    networks:
      - app-network
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-interviewer_db}
      - INTERVIEWER_USER_ID=${INTERVIEWER_USER_ID:-user-123}
      - INTERVIEWER_EMAIL=${INTERVIEWER_EMAIL:-test@example.com}
      - INTERVIEWER_DISPLAY_NAME=${INTERVIEWER_DISPLAY_NAME:-TestUser}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: