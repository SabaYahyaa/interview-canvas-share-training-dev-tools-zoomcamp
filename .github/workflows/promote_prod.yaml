name: Manual Production Promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR Image Tag to promote to Production (e.g., latest or 2026-09-28-sha)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: read

jobs:
  promote-to-prod:
    name: Promote Image to Production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Production Deployment
        env:
          RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
          TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$RENDER_PROD_DEPLOY_HOOK" ]; then
            echo "Promoting image tag '$TAG' to Production on Render..."
            curl -X POST "$RENDER_PROD_DEPLOY_HOOK"
          else
            echo "RENDER_PROD_DEPLOY_HOOK secret is not set."
            exit 1
          fi
