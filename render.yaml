############################################################
#   Cloud Multi-Container Environment Blueprint
############################################################
name: CI/CD Pipeline & Automatic Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interviewer_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Environment Variables from .env
        uses: xaviercf/dotenv-action@v1
        with:
          path: ./.env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: poetry install

      - name: Install Flake8
        working-directory: ./backend
        run: poetry run pip install flake8

      # --------------------------------------------------
      # Quality Gate 1: Code Formatting (Black)
      # --------------------------------------------------
      - name: Code Formatting Check (Black)
        working-directory: ./backend
        run: poetry run black --check .

      # --------------------------------------------------
      # Quality Gate 2: Code Quality Linting (Flake8)
      # --------------------------------------------------
      - name: Code Quality Linting (Flake8)
        working-directory: ./backend
        run: poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # --------------------------------------------------
      # Quality Gate 3: Pytest Suite
      # --------------------------------------------------
      - name: Run Pytest Backend Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interviewer_db
          INTERVIEWER_USER_ID: user-123
          INTERVIEWER_EMAIL: test@example.com
          INTERVIEWER_DISPLAY_NAME: TestUser
        run: poetry run pytest -v

      # --------------------------------------------------
      # Quality Gate 4: E2E Integration Suite (Makefile)
      # --------------------------------------------------
      - name: Run Makefile Integration Tests
        run: make e2e

      # --------------------------------------------------
      # Deployment Stage: Trigger Render Deploy Hook
      # --------------------------------------------------
      - name: Trigger Render Deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "All quality gates (Black, Flake8, pytest, E2E) passed!"
            echo "Triggering automated Render deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy trigger."
          fi